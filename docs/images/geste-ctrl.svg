<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="320" viewBox="0 0 1320 320" role="img" aria-labelledby="title desc">
<title id="title">Utiliser Meloo en trois gestes</title>
<desc id="desc">Glisser un fichier depuis l’Explorateur, appuyer sur Ctrl pendant le glissement, puis déposer sur le format de destination.</desc>
<defs><linearGradient id="bg"><stop stop-color="#fff2e9"/><stop offset="1" stop-color="#e4f6ed"/></linearGradient></defs>
<rect width="1320" height="320" rx="28" fill="url(#bg)"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#233c36">
<g transform="translate(40 34)"><rect width="380" height="252" rx="20" fill="#fff" fill-opacity=".8"/><circle cx="35" cy="34" r="19" fill="#f47748"/><text x="35" y="40" text-anchor="middle" fill="#fff" font-weight="700" font-size="18">1</text><path d="M170 38h47l24 24v67h-71z" fill="#ffe3ce" stroke="#cf7047" stroke-width="3"/><path d="M217 38v24h24" fill="none" stroke="#cf7047" stroke-width="3"/><text x="205" y="101" text-anchor="middle" font-size="17" font-weight="700">PNG</text><text x="190" y="179" text-anchor="middle" font-size="25" font-weight="700">Glissez un fichier</text><text x="190" y="213" text-anchor="middle" font-size="17">Depuis l’Explorateur ou le Bureau.</text></g>
<g transform="translate(470 34)"><rect width="380" height="252" rx="20" fill="#fff" fill-opacity=".8"/><circle cx="35" cy="34" r="19" fill="#e77b83"/><text x="35" y="40" text-anchor="middle" fill="#fff" font-weight="700" font-size="18">2</text><rect x="129" y="51" width="122" height="70" rx="15" fill="#fbe4e6" stroke="#b86773" stroke-width="3"/><text x="190" y="97" text-anchor="middle" font-size="32" font-weight="700">Ctrl</text><text x="190" y="179" text-anchor="middle" font-size="25" font-weight="700">Appuyez sur Ctrl</text><text x="190" y="213" text-anchor="middle" font-size="17">Gardez le fichier en cours de glissement.</text></g>
<g transform="translate(900 34)"><rect width="380" height="252" rx="20" fill="#fff" fill-opacity=".8"/><circle cx="35" cy="34" r="19" fill="#449575"/><text x="35" y="40" text-anchor="middle" fill="#fff" font-weight="700" font-size="18">3</text><circle cx="190" cy="86" r="45" fill="#d6eee0" stroke="#449575" stroke-width="3"/><path d="M190 41v90M145 86h90M158 54l64 64M158 118l64-64" stroke="#fff" stroke-width="3"/><circle cx="190" cy="86" r="20" fill="#f1fbf5"/><text x="190" y="179" text-anchor="middle" font-size="25" font-weight="700">Déposez sur un format</text><text x="190" y="213" text-anchor="middle" font-size="17">Ou sur Créer ZIP, toujours en haut.</text></g>
<path d="M432 155h25m-10-10 10 10-10 10M862 155h25m-10-10 10 10-10 10" fill="none" stroke="#58756a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g></svg>
